<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="김현민 프론트엔드 개발자 포트폴리오">
  <title>HYUNMIN — 김현민 포트폴리오</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260730-2">
</head>
<body>
  <main id="os" class="booting">
    <section id="boot" class="overlay boot">
      <div>
        <p class="os-logo">HYUNMIN</p>
        <div id="boot-lines"></div>
        <button class="ghost skip">SKIP BOOT ↗</button>
        <div class="progress"><i></i></div>
      </div>
    </section>
    <section id="lock" class="overlay lock" aria-label="잠금 화면">
      <p id="lock-time" class="clock">12:08</p>
      <p id="lock-date"></p>
      <div class="identity">
        <div class="avatar">N</div>
        <h1>김현민</h1>
        <p>Frontend Developer in Progress</p>
        <button class="primary unlock">포트폴리오 열기 <b>↗</b></button>
        <small>CLICK OR PRESS ENTER TO UNLOCK</small>
      </div>
    </section>
    <section id="desktop" aria-label="HYUNMIN 바탕화면">
      <header class="desktop-brand"><b>●</b> HYUNMIN <span>File　Edit　View　Window　Help</span><em>Portfolio Edition　◌　<span id="menu-time">12:08</span></em></header>
      <div id="icons" class="icons"></div>
      <div id="windows"></div>
      <div id="toast" role="status"></div>
      <div id="start-menu" class="start-menu">
        <p class="os-logo">HYUNMIN</p>
        <div id="start-apps"></div>
        <button class="lock-action">⌑ 화면 잠금</button>
        <small>Portfolio Edition · 2026</small>
      </div>
      <footer class="taskbar">
        <button id="start" aria-label="시작 메뉴">⌘</button>
        <div id="dock-apps"></div>
        <div id="task-apps"></div>
        <button class="quick-app" data-app="settings" title="Settings">⚙</button>
        <span class="tray"><span id="tray-time">12:08</span></span>
      </footer>
    </section>
  </main>
  <script src="script.js?v=20260730-2"></script>
</body>
</html>
